name: Checkstyle

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_core: ${{ steps.filter.outputs.backend_core }}
      backend_plagscan: ${{ steps.filter.outputs.backend_plagscan }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend_core:
              - backend-core/**
            backend_plagscan:
              - backend-plagscan/**
            frontend:
              - frontend/**

  checkstyle-backend-core:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.backend_core == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run Checkstyle (backend-core)
        run: mvn -pl backend-core checkstyle:check

  checkstyle-backend-plagscan:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.backend_plagscan == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run Checkstyle (backend-plagscan)
        run: mvn -pl backend-plagscan checkstyle:check

  eslint-frontend:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.frontend == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show npm config
        run: |
          npm config get registry
          npm config list

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
