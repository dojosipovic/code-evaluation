name: Checkstyle

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "backend-core/**"
      - "backend-plagscan/**"
      - "pom.xml"
      - "**/pom.xml"
      - "checkstyle.xml"
      - "checkstyle-suppressions.xml"
      - ".github/workflows/checkstyle.yml"

jobs:
  checkstyle:
    name: Checkstyle (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [ backend-core, backend-plagscan ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle
        run: mvn -pl ${{ matrix.module }} -am checkstyle:check -e
