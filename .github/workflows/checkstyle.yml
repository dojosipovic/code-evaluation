name: Checkstyle

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_core: ${{ steps.filter.outputs.backend_core }}
      backend_plagscan: ${{ steps.filter.outputs.backend_plagscan }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_core:
              - backend-core/**
            backend_plagscan:
              - backend-plagscan/**

  checkstyle:
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [ backend-core, backend-plagscan ]

    if: |
      (matrix.module == 'backend-core' && needs.detect-changes.outputs.backend_core == 'true') ||
      (matrix.module == 'backend-plagscan' && needs.detect-changes.outputs.backend_plagscan == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Checkstyle
        run: mvn -pl ${{ matrix.module }} -am checkstyle:check
