name: Build and deploy service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment"
        required: true
        type: choice
        options:
          - production

      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - backend-core
          - frontend

      version:
        description: "Service release version, format x.x.x"
        required: true
        type: string

      deploy:
        description: "Trigger Dokploy deploy after build/check"
        required: true
        type: boolean
        default: true

env:
  RELEASE_BRANCH_PREFIX: release
  REGISTRY: ghcr.io

  # Za repo "moja-org/moj-repo", ovo je "moja-org".
  # Finalni image je npr. ghcr.io/moja-org/frontend:1.2.3
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    concurrency:
      group: build-${{ inputs.environment }}-${{ inputs.service }}-${{ inputs.version }}
      cancel-in-progress: false

    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_exists: ${{ steps.check_image.outputs.exists }}
      is_latest_release: ${{ steps.release.outputs.is_latest_release }}
      service_tag: ${{ steps.release.outputs.service_tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve service metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"

          case "$SERVICE" in
            backend-core)
              DOCKERFILE="backend-core/src/main/docker/Dockerfile.jvm"
              CONTEXT="."
              IMAGE_NAME="backend-core"
              ;;
            frontend)
              DOCKERFILE="frontend/Dockerfile"
              CONTEXT="frontend"
              IMAGE_NAME="frontend"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Validate service tag and release branch
        id: release
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"
          VERSION="${{ inputs.version }}"
          SERVICE_TAG="${SERVICE}@${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be in x.x.x format, for example 1.2.3"
            exit 1
          fi

          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags --force

          if ! git rev-parse "$SERVICE_TAG^{tag}" >/dev/null 2>&1 && ! git rev-parse "$SERVICE_TAG^{commit}" >/dev/null 2>&1; then
            echo "Git tag '$SERVICE_TAG' does not exist."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$SERVICE_TAG")"

          mapfile -t RELEASE_BRANCHES < <(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/${RELEASE_BRANCH_PREFIX}/*")

          if [[ "${#RELEASE_BRANCHES[@]}" -eq 0 ]]; then
            echo "No remote release branches found under origin/${RELEASE_BRANCH_PREFIX}/*."
            exit 1
          fi

          TAG_RELEASE_BRANCH=""
          for RELEASE_BRANCH in "${RELEASE_BRANCHES[@]}"; do
            if git merge-base --is-ancestor "$TAG_COMMIT" "$RELEASE_BRANCH"; then
              TAG_RELEASE_BRANCH="$RELEASE_BRANCH"
              break
            fi
          done

          if [[ -z "$TAG_RELEASE_BRANCH" ]]; then
            echo "Tag '$SERVICE_TAG' is not reachable from any origin/${RELEASE_BRANCH_PREFIX}/* branch."
            exit 1
          fi

          SERVICE_TAGS="$(
            for RELEASE_BRANCH in "${RELEASE_BRANCHES[@]}"; do
              git tag --merged "$RELEASE_BRANCH"
            done \
              | grep -E "^${SERVICE}@[0-9]+\.[0-9]+\.[0-9]+$" || true
          )"

          LATEST_SERVICE_VERSION="$(
            printf '%s\n' "$SERVICE_TAGS" \
              | sort -u \
              | sed "s/^${SERVICE}@//" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$LATEST_SERVICE_VERSION" ]]; then
            echo "No semver tags found for service '$SERVICE' on origin/${RELEASE_BRANCH_PREFIX}/* branches."
            exit 1
          fi

          echo "Selected service tag: $SERVICE_TAG"
          echo "Selected version: $VERSION"
          echo "Selected tag release branch: $TAG_RELEASE_BRANCH"
          echo "Latest service version on origin/${RELEASE_BRANCH_PREFIX}/*: ${SERVICE}@${LATEST_SERVICE_VERSION}"

          if [[ "$VERSION" == "$LATEST_SERVICE_VERSION" ]]; then
            echo "is_latest_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "service_tag=$SERVICE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout selected service release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.service_tag }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check_image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Image already exists: $IMAGE:$VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist: $IMAGE:$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_image.outputs.exists == 'false' || steps.release.outputs.is_latest_release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push version image
        if: steps.check_image.outputs.exists == 'false' && steps.release.outputs.is_latest_release != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push version + latest image
        if: steps.check_image.outputs.exists == 'false' && steps.release.outputs.is_latest_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update latest tag for existing latest release image
        if: steps.check_image.outputs.exists == 'true' && steps.release.outputs.is_latest_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: inputs.deploy == true

    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false

    steps:
      - name: Resolve Dokploy application
        id: dokploy
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"

          case "$SERVICE" in
            backend-core)
              DOKPLOY_APP_ID="${{ secrets.DOKPLOY_APP_ID_BACKEND_CORE }}"
              ;;
            frontend)
              DOKPLOY_APP_ID="${{ secrets.DOKPLOY_APP_ID_FRONTEND }}"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          if [[ -z "$DOKPLOY_APP_ID" ]]; then
            echo "Dokploy app id is empty for service '$SERVICE'."
            exit 1
          fi

          echo "dokploy_app_id=$DOKPLOY_APP_ID" >> "$GITHUB_OUTPUT"

      - name: Update Dokploy Docker image
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DOKPLOY_REGISTRY_USERNAME: ${{ secrets.DOKPLOY_REGISTRY_USERNAME }}
          DOKPLOY_REGISTRY_PASSWORD: ${{ secrets.DOKPLOY_REGISTRY_PASSWORD }}
          DOKPLOY_APP_ID: ${{ steps.dokploy.outputs.dokploy_app_id }}
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail

          DOKPLOY_URL="${DOKPLOY_URL%/}"
          DOCKER_IMAGE="${IMAGE}:${VERSION}"

          jq -n \
            --arg applicationId "$DOKPLOY_APP_ID" \
            --arg dockerImage "$DOCKER_IMAGE" \
            --arg username "$DOKPLOY_REGISTRY_USERNAME" \
            --arg password "$DOKPLOY_REGISTRY_PASSWORD" \
            --arg registryUrl "$REGISTRY" \
            '{
              applicationId: $applicationId,
              dockerImage: $dockerImage,
              username: (if $username == "" then null else $username end),
              password: (if $password == "" then null else $password end),
              registryUrl: $registryUrl
            }' > dokploy-docker-provider.json

          HTTP_CODE="$(
            curl -sS -o dokploy-save-docker-provider-response.txt -w "%{http_code}" -X POST \
            "${DOKPLOY_URL}/api/application.saveDockerProvider" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Dokploy-Deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            --data-binary @dokploy-docker-provider.json
          )"

          echo "HTTP_CODE=${HTTP_CODE}"
          cat dokploy-save-docker-provider-response.txt

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            exit 1
          fi

      - name: Trigger Dokploy deployment through Cloudflare Access
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DOKPLOY_APP_ID: ${{ steps.dokploy.outputs.dokploy_app_id }}
        run: |
          set -euo pipefail

          DOKPLOY_URL="${DOKPLOY_URL%/}"

          HTTP_CODE="$(
            curl -sS -o dokploy-deploy-response.txt -w "%{http_code}" -X POST \
            "${DOKPLOY_URL}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Dokploy-Deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
          )"

          echo "HTTP_CODE=${HTTP_CODE}"
          cat dokploy-deploy-response.txt

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            exit 1
          fi
