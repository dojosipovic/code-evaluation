name: Build and deploy service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment"
        required: true
        type: choice
        options:
          - production

      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - backend-core
          - frontend

      version:
        description: "Service release version, format x.x.x"
        required: true
        type: string

      deploy:
        description: "Trigger Dokploy deploy after build/check"
        required: true
        type: boolean
        default: true

env:
  RELEASE_BRANCH: release
  REGISTRY: ghcr.io

  # Za repo "moja-org/moj-repo", ovo je "moja-org".
  # Finalni image će biti npr:
  # ghcr.io/moja-org/my-frontend-production:1.2.3
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    concurrency:
      group: build-${{ inputs.environment }}-${{ inputs.service }}-${{ inputs.version }}
      cancel-in-progress: false

    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_exists: ${{ steps.check_image.outputs.exists }}
      is_latest_release: ${{ steps.release.outputs.is_latest_release }}
      service_tag: ${{ steps.release.outputs.service_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve service metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"

          case "$SERVICE" in
            backend-core)
              DOCKERFILE="services/api/Dockerfile"
              CONTEXT="services/backend-core"
              IMAGE_NAME="backend-core"
              ;;
            frontend)
              DOCKERFILE="services/frontend/Dockerfile"
              CONTEXT="services/frontend"
              IMAGE_NAME="frontend"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"

          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Validate service tag and release branch
        id: release
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"
          VERSION="${{ inputs.version }}"
          SERVICE_TAG="${SERVICE}@${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be in x.x.x format, for example 1.2.3"
            exit 1
          fi

          git fetch origin "$RELEASE_BRANCH" --tags --force

          if ! git rev-parse "$SERVICE_TAG^{tag}" >/dev/null 2>&1 && ! git rev-parse "$SERVICE_TAG^{commit}" >/dev/null 2>&1; then
            echo "Git tag '$SERVICE_TAG' does not exist."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$SERVICE_TAG")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$RELEASE_BRANCH"; then
            echo "Tag '$SERVICE_TAG' is not reachable from origin/$RELEASE_BRANCH."
            exit 1
          fi

          LATEST_SERVICE_VERSION="$(
            git tag --merged "origin/$RELEASE_BRANCH" \
              | grep -E "^${SERVICE}@[0-9]+\.[0-9]+\.[0-9]+$" \
              | sed "s/^${SERVICE}@//" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$LATEST_SERVICE_VERSION" ]]; then
            echo "No semver tags found for service '$SERVICE' on origin/$RELEASE_BRANCH."
            exit 1
          fi

          echo "Selected service tag: $SERVICE_TAG"
          echo "Latest service version on $RELEASE_BRANCH: ${SERVICE}@${LATEST_SERVICE_VERSION}"

          if [[ "$VERSION" == "$LATEST_SERVICE_VERSION" ]]; then
            echo "is_latest_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "service_tag=$SERVICE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout selected service release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.service_tag }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check_image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ inputs.version }}"

          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Image already exists: $IMAGE:$VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist: $IMAGE:$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push version image
        if: steps.check_image.outputs.exists == 'false' && steps.release.outputs.is_latest_release != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push version + latest image
        if: steps.check_image.outputs.exists == 'false' && steps.release.outputs.is_latest_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: inputs.deploy == true

    # Ovo mora odgovarati stvarnom GitHub Environmentu:
    # Settings -> Environments -> production
    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false

    steps:
      - name: Resolve Dokploy application
        id: dokploy
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ inputs.service }}"

          case "$SERVICE" in
            backend-core)
              DOKPLOY_APP_ID="${{ secrets.DOKPLOY_APP_ID_BACKEND_CORE }}"
              ;;
            frontend)
              DOKPLOY_APP_ID="${{ secrets.DOKPLOY_APP_ID_FRONTEND }}"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          if [[ -z "$DOKPLOY_APP_ID" ]]; then
            echo "Dokploy app id is empty for service '$SERVICE'."
            exit 1
          fi

          echo "dokploy_app_id=$DOKPLOY_APP_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment through Cloudflare Access
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -d '{"applicationId":"${{ steps.dokploy.outputs.dokploy_app_id }}"}'
