name: Tests

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, ready_for_review ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_core: ${{ steps.filter.outputs.backend_core }}
      backend_plagscan: ${{ steps.filter.outputs.backend_plagscan }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend_core:
              - backend-core/**
              - pom.xml
            backend_plagscan:
              - backend-plagscan/**
              - pom.xml
            frontend:
              - frontend/**

  tests-backend-core:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.backend_core == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run backend-core tests
        run: mvn -pl backend-core -am verify -DskipITs=false

  tests-backend-plagscan:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.backend_plagscan == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run backend-plagscan tests
        run: mvn -pl backend-plagscan -am verify -DskipITs=false

  tests-frontend:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.frontend == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci
