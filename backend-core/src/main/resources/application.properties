mp.jwt.verify.issuer=code-evaluation
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# Datasource
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
%dev.quarkus.datasource.username=appuser
%dev.quarkus.datasource.password=apppass
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Quartz
quarkus.quartz.store-type=jdbc-tx
quarkus.quartz.table-prefix=qrtz.qrtz_
quarkus.quartz.clustered=false
quarkus.quartz.thread-count=5
quarkus.quartz.serialize-job-data=false

#CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.access-control-allow-credentials=true

#Mail
quarkus.mailer.from=test@lokalno.dev
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.username=
quarkus.mailer.password=
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false

#HTTP
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%r" %s %b %D

# Invite
invite.status-expired.cron.expression=${INVITE_STATUS_EXPIRED_CRON_EXPRESSION:0 0 */5 * * ?}

# Assignment reminders
assignment.reminder.lead-time=${ASSIGNMENT_REMINDER_LEAD_TIME:5m}
assignment.post-action.delay=${ASSIGNMENT_POST_ACTION_DELAY:2m}

# Metadata
metadata.timezone=${TIMEZONE:Europe/Zagreb}
