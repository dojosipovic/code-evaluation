mp.jwt.verify.issuer=code-evaluation
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# Datasource
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
%dev.quarkus.datasource.username=appuser
%dev.quarkus.datasource.password=apppass
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Quartz
quarkus.quartz.store-type=jdbc-tx
quarkus.quartz.table-prefix=qrtz.qrtz_
quarkus.quartz.clustered=false
quarkus.quartz.thread-count=5
quarkus.quartz.serialize-job-data=false

#CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.access-control-allow-credentials=true

# Two-factor authentication
security.totp.issuer=${SECURITY_TOTP_ISSUER:Code Evaluation}
security.webauthn.rp-id=${SECURITY_WEBAUTHN_RP_ID:localhost}
security.webauthn.rp-name=${SECURITY_WEBAUTHN_RP_NAME:Code Evaluation}
security.webauthn.origin=${SECURITY_WEBAUTHN_ORIGIN:http://localhost:4200}

#Mail
quarkus.mailer.from=test@lokalno.dev
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.username=
quarkus.mailer.password=
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false

#HTTP
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%r" %s %b %D

# Health
quarkus.smallrye-health.root-path=/api/health

# Observability / Grafana Cloud OTLP
quarkus.application.name=backend-core
quarkus.otel.service.name=${GRAFANA_SERVICE_NAME:backend-core}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
quarkus.otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS:}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLE_RATIO:0.25}
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true

# REST clients
quarkus.rest-client.plagscan-api.url=${PLAGSCAN_API_URL:http://localhost:8081}

# Limiters
limiter.plag-scan.max-parallel-runs=${PLAGSCAN_MAX_PARALEL_RUNS:1}
limiter.sandbox.max-parallel-runs=${PLAGSCAN_MAX_PARALEL_RUNS:1}

# Invite
invite.status-expired.cron.expression=${INVITE_STATUS_EXPIRED_CRON_EXPRESSION:0 0 */5 * * ?}

# Mail templates
mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
mail.public-base-url=${MAIL_PUBLIC_BASE_URL:http://localhost:8080}
mail.logo-path=${MAIL_LOGO_PATH:/api/mail-assets/logo.png}
mail.logo-url=${MAIL_LOGO_URL:}
mail.invite.subject=${MAIL_INVITE_SUBJECT:Pozivnica za Code Evaluation}
mail.invite.title=${MAIL_INVITE_TITLE:Pozivnica za Code Evaluation}
mail.assignment-start-reminder.subject=${MAIL_ASSIGNMENT_START_REMINDER_SUBJECT:Podsjetnik: assignment %assignmentName% uskoro pocinje}
mail.assignment-start-reminder.title=${MAIL_ASSIGNMENT_START_REMINDER_TITLE:Assignment uskoro pocinje}
mail.assignment-post-action.subject=${MAIL_ASSIGNMENT_POST_ACTION_SUBJECT:Ocijeni assignment %assignmentName%}
mail.assignment-post-action.title=${MAIL_ASSIGNMENT_POST_ACTION_TITLE:Assignment je spreman za ocjenjivanje}
mail.submission-evaluated.subject=${MAIL_SUBMISSION_EVALUATED_SUBJECT:Rezultati za assignment %assignmentName% su dostupni}
mail.submission-evaluated.title=${MAIL_SUBMISSION_EVALUATED_TITLE:Submission je ocijenjen}

# Assignment reminders
assignment.reminder.lead-time=${ASSIGNMENT_REMINDER_LEAD_TIME:5m}
assignment.post-action.delay=${ASSIGNMENT_POST_ACTION_DELAY:2m}
assignment.post-action.retry-delay=${ASSIGNMENT_POST_ACTION_RETRY_DELAY:10s}
assignment.post-action.max-attempts=${ASSIGNMENT_POST_ACTION_MAX_ATTEMPTS:12}
assignment.post-action.plagscan-min-similarity=${ASSIGNMENT_POST_ACTION_PLAGSCAN_MIN_SIMILARITY:0.10}

# Metadata
metadata.timezone=${TIMEZONE:Europe/Zagreb}
