<div class="dialog-content">
  <div class="users-toolbar">
    <div class="filter-field">
      <label for="nonMemberSearch">Search</label>
      <input
        id="nonMemberSearch"
        pInputText
        [(ngModel)]="userFilters.search"
        (ngModelChange)="onSearchInput($event)"
        (keyup.enter)="onApplySearch()"
        placeholder="Pretrazi korisnike" />
    </div>

    <div class="toolbar-actions">
      <button
        pButton
        type="button"
        icon="pi pi-refresh"
        label="Reset"
        class="p-button-secondary"
        (click)="resetSearch()">
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <p-table
      [value]="loading() ? skeletonRows : users"
      [lazy]="true"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[10, 20, 50]"
      (onLazyLoad)="onLazyLoad($event)"
      class="p-datatable-sm non-members-table">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id">
            ID
            <p-sortIcon field="id"></p-sortIcon>
          </th>

          <th>Korisnicko ime</th>
          <th>Ime</th>
          <th>Prezime</th>
          <th>Email</th>
          <th>Rola</th>
          <th class="actions-column">Akcije</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.id }}</td>
          <td>
            <div class="primary-cell">{{ user.username }}</div>
          </td>
          <td>{{ user.firstname || '-' }}</td>
          <td>{{ user.lastname || '-' }}</td>
          <td>{{ user.email }}</td>
          <td>
            <p-tag [value]="user.role"></p-tag>
          </td>
          <td class="actions-column">
            <button
              pButton
              type="button"
              icon="pi pi-plus"
              [rounded]="true"
              [text]="true"
              aria-label="Dodaj clana"
              title="Dodaj clana"
              [loading]="isAdding(user)"
              (click)="addMember(user)">
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr>
          <td><p-skeleton width="2rem" height="1.1rem"></p-skeleton></td>
          <td><p-skeleton width="8rem" height="1.1rem"></p-skeleton></td>
          <td><p-skeleton width="7rem" height="1.1rem"></p-skeleton></td>
          <td><p-skeleton width="8rem" height="1.1rem"></p-skeleton></td>
          <td><p-skeleton width="12rem" height="1.1rem"></p-skeleton></td>
          <td><p-skeleton width="5rem" height="1.6rem" borderRadius="12px"></p-skeleton></td>
          <td class="actions-column">
            <p-skeleton width="2rem" height="2rem" borderRadius="50%"></p-skeleton>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7">Nema korisnika za dodavanje.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
