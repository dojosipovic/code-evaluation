<p-card>
    <button pButton type="button" (click)="editorOpen = true">
        Open task editor
    </button>

    @if (editorOpen) {
        <app-task-create-dialog (closed)="editorOpen = false"></app-task-create-dialog>
    }

    <p-button
        label="Dohvati moje podatke"
        icon="pi pi-user"
        (onClick)="loadMe()"
        styleClass="mb-3">
    </p-button>

    @if (me) {
        <pre>{{ me }}</pre>
    }

</p-card>
