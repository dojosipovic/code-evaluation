<div class="page-wrapper">
  @if (loading()) {
    <p-card class="main-card">
      <div class="group-header">
        <div class="group-title-block">
          <p-skeleton width="14rem" height="2rem"></p-skeleton>
          <p-skeleton width="12rem" height="1rem"></p-skeleton>
        </div>

        <p-skeleton width="7rem" height="2.5rem" borderRadius="10px"></p-skeleton>
      </div>

      <p-skeleton width="100%" height="10rem"></p-skeleton>
    </p-card>
  } @else if (group) {
    <div class="page-actions">
      <button
        pButton
        type="button"
        icon="pi pi-arrow-left"
        label="Nazad"
        class="p-button-secondary"
        routerLink="/groups">
      </button>
    </div>

    <p-card class="main-card">
      @if (group.description) {
        <p-accordion class="description-accordion">
          <p-accordion-panel value="description">
            <p-accordion-header>Opis</p-accordion-header>
            <p-accordion-content>
              <p-scrollpanel [style]="{ width: '100%', height: '180px' }">
                <p class="description-text">{{ group.description }}</p>
              </p-scrollpanel>
            </p-accordion-content>
          </p-accordion-panel>
        </p-accordion>
      }

      <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
        <p-tablist>
          <p-tab value="users">
            <div class="tab-label">
              <i class="pi pi-users"></i>
              <span>Clanovi</span>
              <p-badge [value]="group.memberCount"></p-badge>
            </div>
          </p-tab>

          <p-tab value="tasks">
            <div class="tab-label">
              <i class="pi pi-receipt"></i>
              <span>Zadaci</span>
            </div>
          </p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel value="users">
            <div class="tab-empty-state">
              Clanovi grupe ce biti prikazani ovdje.
            </div>
          </p-tabpanel>

          <p-tabpanel value="tasks">
            <div class="tab-empty-state">
              Zadaci grupe ce biti prikazani ovdje.
            </div>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </p-card>
  }
</div>
