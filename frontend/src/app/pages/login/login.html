<div class="bg">
  <div class="shell">
    <p-card styleClass="card">
      <div class="header">
        <div class="brand">
          <img src="/icon.png" alt="Logo" class="brand-icon" />
          <span>Code Evaluation</span>
        </div>
      </div>

      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" pInputText type="username" formControlName="username" placeholder="johndoe" />
          @if (isInvalid('username')) {
            <small class="error">Unesi username</small>
          }
        </div>

        <div class="field">
          <label for="password">Lozinka</label>
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="Lozinka">
          </p-password>
          @if (isInvalid('password')) {
            <small class="error">Lozinka je obavezna.</small>
          }
        </div>

        <div class="row">
          <div class="remember">
            <p-checkbox formControlName="remember" inputId="remember" binary="true"></p-checkbox>
            <label for="remember">Zapamti me</label>
          </div>
        </div>

        <p-button
          type="submit"
          label="Prijavi se"
          icon="pi pi-sign-in"
          styleClass="w-full"
          [disabled]="form.invalid || loading"
          [loading]="loading">
        </p-button>
      </form>
    </p-card>
  </div>
</div>
