<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h2>Zadaci</h2>
      <p>Pregled kreiranih zadataka i njihovih autora</p>
    </div>

    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Novi zadatak"
      (click)="editorOpen = true">
    </button>

    @if (editorOpen) {
        <app-task-create-dialog (closed)="editorOpen = false"></app-task-create-dialog>
    }

  </div>

  <p-confirmDialog></p-confirmDialog>

  <p-card class="main-card">
    <div class="filters-section">
      <div class="filters-grid">
        <div class="filter-field">
          <label for="taskSearch">Search</label>
          <input
            id="taskSearch"
            pInputText
            [(ngModel)]="taskFilters.search"
            (ngModelChange)="onSearchInput($event)"
            (keyup.enter)="onApplyFilters()"
            placeholder="Pretraži po nazivu zadatka" />
        </div>

        <div class="filter-field">
          <label for="taskStatus">Status</label>
          <p-select
            inputId="taskStatus"
            [options]="taskStatusOptions"
            [(ngModel)]="taskFilters.status"
            optionLabel="label"
            optionValue="value"
            placeholder="Odaberi status"
            [showClear]="false"
            (onChange)="onFiltersChange()">
          </p-select>
        </div>

        <div class="filter-field">
          <label for="taskEnabled">Enabled</label>
          <p-select
            inputId="taskEnabled"
            [options]="enabledOptions"
            [(ngModel)]="taskFilters.enabled"
            optionLabel="label"
            optionValue="value"
            placeholder="Odaberi enabled"
            [showClear]="false"
            (onChange)="onFiltersChange()">
          </p-select>
        </div>

        <div class="filter-field">
          <label for="taskShared">Shared</label>
          <p-select
            inputId="taskShared"
            [options]="sharedOptions"
            [(ngModel)]="taskFilters.shared"
            optionLabel="label"
            optionValue="value"
            placeholder="Odaberi shared"
            [showClear]="false"
            (onChange)="onFiltersChange()">
          </p-select>
        </div>

        <div class="filter-field">
          <label for="excludeCurrentUser">Autor</label>
          <p-select
            inputId="excludeCurrentUser"
            [options]="excludeCurrentUserOptions"
            [(ngModel)]="taskFilters.excludeCurrentUser"
            optionLabel="label"
            optionValue="value"
            placeholder="Odaberi autora"
            [showClear]="false"
            (onChange)="onFiltersChange()">
          </p-select>
        </div>
      </div>

      <div class="filter-actions">
        <button
          pButton
          type="button"
          icon="pi pi-filter"
          label="Primjeni"
          (click)="onApplyFilters()">
        </button>

        <button
          pButton
          type="button"
          icon="pi pi-refresh"
          label="Reset"
          class="p-button-secondary"
          (click)="resetFilters()">
        </button>
      </div>
    </div>

    <p-divider></p-divider>

    <p-menu
        #taskMenu
        [model]="taskMenuItems"
        [popup]="true"
        appendTo="body">
    </p-menu>

    <div class="table-wrapper">
      <p-table
        [value]="tasks"
        [lazy]="true"
        [paginator]="true"
        [rows]="rows"
        [first]="first"
        [totalRecords]="totalRecords"
        [loading]="loading()"
        [rowsPerPageOptions]="[10, 20, 50]"
        (onLazyLoad)="onLazyLoad($event)"
        class="p-datatable-sm tasks-table">

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id">
              ID
              <p-sortIcon field="id"></p-sortIcon>
            </th>

            <th pSortableColumn="title">
              Naziv
              <p-sortIcon field="title"></p-sortIcon>
            </th>

            <th pSortableColumn="status">
              Status
              <p-sortIcon field="status"></p-sortIcon>
            </th>

            <th pSortableColumn="enabled">
              Enabled
              <p-sortIcon field="enabled"></p-sortIcon>
            </th>

            <th pSortableColumn="shared">
              Shared
              <p-sortIcon field="shared"></p-sortIcon>
            </th>

            <th>Autor</th>

            <th class="actions-column">Akcije</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-task>
          <tr>
            <td>{{ task.id }}</td>

            <td>
              <div class="primary-cell">{{ task.title }}</div>
            </td>

            <td>
              <p-tag
                [value]="task.status"
                [severity]="getStatusSeverity(task.status)">
              </p-tag>
            </td>

            <td>
              <i
                class="pi"
                [ngClass]="task.enabled ? 'pi-check enabled-icon' : 'pi-times disabled-icon'">
              </i>
            </td>

            <td>
              <i
                class="pi"
                [ngClass]="task.shared ? 'pi-check enabled-icon' : 'pi-times disabled-icon'">
              </i>
            </td>

            <td>
              <div class="author-cell">
                <div class="author-name">{{ getAuthorName(task) }}</div>
                <div class="author-email">{{ task.user?.email }}</div>
              </div>
            </td>

            <td class="actions-column">
              <button
                pButton
                type="button"
                icon="pi pi-ellipsis-v"
                class="p-button-text p-button-rounded"
                (click)="openTaskMenu($event, taskMenu, task)">
              </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="7">Nema zadataka za zadane filtere.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
